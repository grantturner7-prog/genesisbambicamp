<html lang="en">
<head>

<style>
:root{--pine:#1b4332;--pine9:#0f271d;--moss:#2d6a4f;--cedar:#d4a373;--cedar6:#b9854f;--parch:#faf7f2;--ink:#1c2a23;--lake:#2a7f8e;
--display:'Fraunces Variable','Noto Serif TC Variable',serif;--sans:'Inter Variable','Noto Sans TC Variable',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#0b1a14;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
body[data-lang=zh]{line-height:1.7}
.frame{position:relative;overflow:hidden;background:#000}
.sky{position:absolute;inset:0}
.stage{position:absolute;left:0;top:0;width:1600px;height:1000px;transform-origin:0 0}
.stage>*{position:absolute;left:0;top:0;width:1600px;height:1000px}
.world{transform-origin:0 0}
svg{display:block}
.lab{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:7px;padding:5px 11px 5px 5px;border-radius:999px;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;
 background:linear-gradient(180deg,rgba(15,39,29,.78),rgba(15,39,29,.62));backdrop-filter:blur(10px);border:1px solid rgba(250,247,242,.22);box-shadow:0 10px 24px -8px rgba(0,0,0,.55);letter-spacing:.01em}
.lab .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--cedar);color:var(--pine9);font-size:12px;font-weight:800;position:relative}
.lab .n::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(212,163,115,.7);opacity:.55}
.lab::after{content:'';position:absolute;left:50%;bottom:-9px;width:2px;height:9px;background:linear-gradient(var(--cedar),transparent);transform:translateX(-50%)}
.lab.sel{background:linear-gradient(180deg,#e8c196,#d4a373);color:var(--pine9);border-color:#fff7;font-size:14px;transform:translate(-50%,-100%) scale(1.06)}
.lab.sel .n{background:var(--pine9);color:var(--cedar)}
.lab.sel .n::after{border-color:#fff9}
.lab.dim{opacity:.72;font-size:12px}
.lab.dot{padding:0;width:26px;height:26px;justify-content:center;gap:0}
.lab.dot .t,.lab.dot .sm{display:none}
.lab.dot.sel{width:auto;height:auto;padding:5px 11px 5px 5px;gap:7px}
.lab.dot.sel .t{display:inline}
.lab .sm{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(15,39,29,.55);padding:2px 7px;border-radius:99px;margin-left:2px;color:var(--cedar)}
/* header */
.hdr{position:absolute;left:0;right:0;top:0;height:68px;z-index:30;display:flex;align-items:center;gap:20px;padding:0 28px;color:#fff;background:linear-gradient(180deg,rgba(11,30,22,.9) 0%,rgba(11,30,22,.55) 60%,rgba(11,30,22,0))}
.logo{display:flex;align-items:center;gap:12px}
.mark{width:38px;height:38px;border-radius:11px;background:var(--pine);display:grid;place-items:center;border:1px solid rgba(212,163,115,.45)}
.brand{font-family:var(--display);font-size:17px;line-height:1.1;font-weight:600}
.brand small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cedar);font-weight:600;margin-top:2px}
.nav{margin-left:22px;display:flex;gap:6px;font-size:14px;font-weight:500}
.nav a{padding:7px 14px;border-radius:99px;color:#fff;text-decoration:none;opacity:.85}.nav a.on{background:rgba(255,255,255,.14);opacity:1}
.sp{flex:1}
.seg{display:inline-flex;padding:3px;border-radius:99px;background:rgba(15,39,29,.55);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);font-size:12.5px;font-weight:600}
.seg span{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;color:rgba(255,255,255,.75)}
.seg span.on{background:var(--cedar);color:var(--pine9)}
.seg svg{width:14px;height:14px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:99px;font-weight:700;font-size:13.5px;border:0}
.btn.line{background:#06c755;color:#fff}
.btn.gold{background:linear-gradient(180deg,#e6bf94,#d4a373);color:var(--pine9);box-shadow:0 10px 24px -10px rgba(212,163,115,.9)}
/* hero card */
.hero{position:absolute;left:44px;top:142px;width:470px;padding:26px 30px 22px;border-radius:28px;color:#fff;z-index:20;
 background:linear-gradient(160deg,rgba(15,39,29,.78),rgba(15,39,29,.55));backdrop-filter:blur(18px) saturate(1.3);border:1px solid rgba(250,247,242,.16);box-shadow:0 30px 70px -26px rgba(0,0,0,.7)}
.badge{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;background:rgba(212,163,115,.18);border:1px solid rgba(212,163,115,.5);color:#f0cfa8;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.hero h1{font-family:var(--display);font-weight:600;font-size:46px;line-height:1.02;margin:16px 0 12px;letter-spacing:-.02em}
body[data-lang=zh] .hero h1{font-size:42px;line-height:1.2;letter-spacing:0}
.hero h1 em{font-style:italic;font-weight:500;color:#f0cfa8}
.hero p{margin:0;font-size:17px;line-height:1.5;color:rgba(255,255,255,.88)}
.hero .loc{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:13.5px;color:#f0cfa8;font-weight:600}
.hero .cta{display:flex;align-items:center;gap:16px;margin-top:22px}
.hero .hint{font-size:12.5px;color:rgba(255,255,255,.65)}
.kick{margin-top:16px;font-size:11.5px;letter-spacing:.24em;color:rgba(255,255,255,.55);font-weight:600}
.metrics{position:absolute;left:44px;right:44px;bottom:34px;display:grid;grid-template-columns:repeat(5,1fr);border-radius:22px;z-index:20;color:#fff;
 background:linear-gradient(180deg,rgba(15,39,29,.7),rgba(15,39,29,.55));backdrop-filter:blur(16px);border:1px solid rgba(250,247,242,.14)}
.metrics div{padding:16px 22px;border-left:1px solid rgba(255,255,255,.1)}.metrics div:first-child{border-left:0}
.metrics b{display:block;font-family:var(--display);font-size:32px;font-weight:600;color:#f0cfa8;line-height:1}
.metrics span{font-size:12.5px;color:rgba(255,255,255,.75);display:block;margin-top:6px;line-height:1.35}
/* map controls */
.ctl{position:absolute;z-index:25;display:flex;gap:10px;align-items:center}
.glassbtn{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;color:#fff;font-size:13px;font-weight:600;background:rgba(15,39,29,.62);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16)}
.glassbtn svg{width:16px;height:16px}
.vstack{flex-direction:column;align-items:stretch}
.chips{position:absolute;left:0;bottom:36px;z-index:25;display:flex;gap:8px;padding:0 24px;max-width:100%;overflow:hidden}
.chip{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap;color:#fff;background:rgba(15,39,29,.62);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15)}
.chip svg{width:15px;height:15px}.chip.on{background:var(--cedar);color:var(--pine9);border-color:#fff6}
.mock{position:absolute;left:0;right:0;text-align:center;bottom:10px;z-index:40;font-size:10px;letter-spacing:.14em;color:rgba(15,39,29,.4);text-transform:uppercase}
/* panel */
.panel{position:absolute;right:22px;top:84px;bottom:22px;width:452px;z-index:30;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;background:#faf7f2;box-shadow:0 40px 90px -30px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.2)}
.ph{position:relative;padding:20px 22px 14px;color:#fff;overflow:hidden}
.ph .ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;border:1px solid rgba(255,255,255,.3)}
.ph .row{display:flex;align-items:center;gap:12px}
.ph .kick2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.85}
.ph h2{font-family:var(--display);font-weight:600;font-size:25px;line-height:1.1;margin:10px 0 4px;letter-spacing:-.01em}
body[data-lang=zh] .ph h2{line-height:1.25;letter-spacing:0}
.ph p{margin:0;font-size:14px;opacity:.92;line-height:1.45}
.x{position:absolute;right:16px;top:16px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;border:1px solid rgba(255,255,255,.35)}
.nav2{display:flex;gap:6px;margin-left:auto;margin-right:40px}
.nav2 i{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;border:1px solid rgba(255,255,255,.3)}
.tabs{display:flex;gap:2px;padding:0 14px;background:#fff;border-bottom:1px solid #e6dfd1;flex:0 0 auto}
.tabs span{padding:13px 12px;font-size:13.5px;font-weight:600;color:#6d786f;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs span.on{color:var(--pine);border-color:var(--cedar6)}
.body{flex:1;overflow:hidden;padding:18px 20px 22px;position:relative}
.body::after{content:'';position:absolute;left:0;right:0;bottom:0;height:54px;background:linear-gradient(transparent,#faf7f2);pointer-events:none}
.stagebox{position:relative;border-radius:18px;overflow:hidden;height:196px;color:#fff}
.stagebox .cap{position:absolute;left:12px;bottom:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.stagebox .cap b{font-size:13px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.stagebox .cap small{font-size:10.5px;opacity:.85;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:99px;white-space:nowrap}
.pin{position:absolute;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--pine9);background:rgba(255,255,255,.94);padding:3px 9px 3px 3px;border-radius:99px;box-shadow:0 6px 16px -6px rgba(0,0,0,.5);transform:translate(-8px,-50%)}
.pin i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--pine);color:#fff;display:grid;place-items:center;font-size:11px}
.thumbs{display:flex;gap:8px;margin-top:10px}
.thumb{flex:1;height:56px;border-radius:12px;position:relative;overflow:hidden;border:2px solid transparent}
.thumb.on{border-color:var(--cedar6)}
.thumb .pl{position:absolute;inset:0;display:grid;place-items:center;color:#fff}
.thumb .pl svg{width:20px;height:20px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}
.pill{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:7px 12px;border-radius:12px;font-size:12.5px;font-weight:600}
.sum{margin:14px 0 4px;font-size:14.5px;line-height:1.6;color:#33443a}
h3.s{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cedar6);margin:18px 0 10px;font-weight:800}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{background:#fff;border:1px solid #eadfcd;border-radius:16px;padding:12px 13px}
.f .i{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;margin-bottom:8px}
.f b{font-size:13px;display:block;line-height:1.3;margin-bottom:3px}
.f p{margin:0;font-size:12px;line-height:1.5;color:#58665d}
.depth{margin-top:14px;background:#fff;border:1px solid #cfe8e8;border-radius:16px;padding:12px 14px}
.depth .bar{height:12px;border-radius:99px;background:linear-gradient(90deg,#b8f3ee,#4fd0d4 45%,#1b8fa6);margin:8px 0 6px}
.depth .l{display:flex;justify-content:space-between;font-size:11.5px;color:#41605f;font-weight:700}
/* menu */
.banner{border-radius:18px;padding:14px 16px;color:#fff;display:flex;gap:12px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.tag.g{background:#e0f2e6;color:#1f6b3a}.tag.o{background:#fdeedd;color:#9a5a1b}
.msec{margin-top:12px;background:#fff;border:1px solid #eadfcd;border-radius:16px;overflow:hidden}
.msec .mh{display:flex;align-items:center;gap:9px;padding:10px 14px;background:#f6efe2;font-weight:700;font-size:13.5px}
.msec .mh svg{width:17px;height:17px;color:var(--cedar6)}
.it{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid #f0e8d9}
.it:first-of-type{border-top:0}
.it b{font-size:13.5px;display:block}.it small{font-size:11.5px;color:#6a766e;display:block;margin-top:1px;line-height:1.4}
.it .ch{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;align-content:center;max-width:150px}
.ch i{font-style:normal;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:#fdf0dd;color:#8d5a1f}
.ch i.v{background:#e0f2e6;color:#1f6b3a}
.note{margin-top:12px;font-size:12px;color:#56655b;display:flex;gap:8px;line-height:1.5}
/* rules */
.rule{display:flex;gap:12px;background:#fff;border:1px solid #eadfcd;border-radius:16px;padding:12px 14px;margin-top:9px}
.rule .i{flex:0 0 34px;height:34px;border-radius:11px;display:grid;place-items:center}
.rule b{font-size:13.5px;display:block;margin-bottom:2px}.rule p{margin:0;font-size:12.3px;line-height:1.5;color:#56655b}
.rule .num{margin-left:auto;font-family:var(--display);font-size:20px;color:#d9cdb6;font-weight:600}
.van{position:relative;border-radius:18px;background:linear-gradient(180deg,#eef3f1,#dfe8e4);border:1px solid #d3ddd8;height:212px}
.vlegend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:10px;font-size:12px;color:#33443a}
.vlegend div{display:flex;gap:8px;align-items:center}.vlegend i{font-style:normal;flex:0 0 20px;height:20px;border-radius:50%;background:var(--pine);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
/* mobile */
.m .hdr{height:56px;padding:0 14px;gap:10px}.m .brand{font-size:14px}.m .brand small{font-size:9.5px}.m .mark{width:32px;height:32px}
.sheet{position:absolute;left:0;right:0;bottom:0;height:62%;z-index:30;border-radius:26px 26px 0 0;overflow:hidden;background:#faf7f2;display:flex;flex-direction:column;box-shadow:0 -30px 70px -20px rgba(0,0,0,.6)}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.55);position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:5}
.m .ph{padding:22px 18px 12px}.m .ph h2{font-size:21px}.m .body{padding:14px 16px}
.m .tabs{padding:0 6px}.m .tabs span{padding:11px 9px;font-size:12.5px}
.m .hero{left:14px;right:14px;top:70px;width:auto;padding:16px 18px 16px;border-radius:22px}.m .hero .kick,.m .hero .loc{display:none}.m .hero .cta{margin-top:14px}.m .mock{display:none}
.m .hero h1{font-size:30px;margin:10px 0 6px}body[data-lang=zh].m .hero h1{font-size:28px}
.m .hero p{font-size:13.5px}
.m .metrics{left:14px;right:14px;bottom:18px;grid-template-columns:repeat(3,1fr)}
.m .metrics div{padding:11px 12px}.m .metrics b{font-size:22px}.m .metrics span{font-size:10.5px}
.m .metrics div:nth-child(n+4){display:none}
.m .chips{bottom:auto;top:70px}
</style>
</head>

<script>
(() => {
const C = window.CONTENT;
const q = new URLSearchParams(location.search);
const lang = q.get('lang') === 'zh' ? 'zh' : 'en';
const scene = q.get('scene') || 'hero';       // hero | area
const areaId = q.get('area') || 'pool';
const tab = q.get('tab') || 'highlights';
const season = q.get('season') === 'winter' ? 'winter' : 'summer';
const time = q.get('time') === 'dusk' ? 'dusk' : 'day';
const mobile = q.get('mobile') === '1';
const W = mobile ? 390 : 1440, H = mobile ? 844 : 900;
document.body.dataset.lang = lang;
if (mobile) document.body.classList.add('m');
const S = C.strings[lang === 'zh' ? 'zh-TW' : 'en'];
const t = (l) => l[lang];
const ic = (n, sz = 20) => (C.ICONS[n] || '').replace(/width="\d+"/, `width="${sz}"`).replace(/height="\d+"/, `height="${sz}"`);
const AREA = Object.fromEntries(C.AREAS.map(a => [a.id, a]));

/* ---------------------------------------------------------------- iso helpers */
const SC = 17, OX = 800, OY = 548, K = 0.866;
const P = (x, z, h = 0) => [OX + (x - z) * K * SC, OY + (x + z) * 0.5 * SC - h * SC];
const f1 = n => Math.round(n * 10) / 10;
const pts = a => a.map(p => f1(p[0]) + ',' + f1(p[1])).join(' ');
const poly = (a, fill, extra = '') => `<polygon points="${pts(a)}" fill="${fill}" ${extra}/>`;
const hexToRgb = h => { if (h.length === 4) h = '#' + h[1] + h[1] + h[2] + h[2] + h[3] + h[3]; return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); };
const shade = (h, k) => { const [r, g, b] = hexToRgb(h); const c = v => Math.max(0, Math.min(255, Math.round(v * k))); return `rgb(${c(r)},${c(g)},${c(b)})`; };
function rnd(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const blob = (cx, cz, rx, rz, n, amp, seed, off = 0) => { const r = rnd(seed); const ph = [r() * 6, r() * 6, r() * 6]; const out = []; for (let i = 0; i < n; i++) { const th = i / n * Math.PI * 2; const k = 1 + amp * (Math.sin(3 * th + ph[0]) * .6 + Math.sin(5 * th + ph[1]) * .3 + Math.sin(2 * th + ph[2]) * .5) + off; out.push([cx + Math.cos(th) * rx * k, cz + Math.sin(th) * rz * k]); } return out; };
const toS = (pl, h = 0) => pl.map(p => P(p[0], p[1], h));
const inPoly = (x, z, pl) => { let c = false; for (let i = 0, j = pl.length - 1; i < pl.length; j = i++) { const [xi, zi] = pl[i], [xj, zj] = pl[j]; if (((zi > z) !== (zj > z)) && (x < (xj - xi) * (z - zi) / (zj - zi) + xi)) c = !c; } return c; };

/* ---------------------------------------------------------------- palette */
const PAL = {
  summer: { skyT: '#7cc4ff', skyB: '#e9f7ff', grass: '#88bb6c', meadow: '#a8d57d', forest: '#4d8a56', path: '#f1e6cc', road: '#cfc6b3', shallow: '#86d4d9', deep: '#2c8da1', pool: '#74eae2', pine: '#2e7d52', broad: '#5aa35b', cyp: '#3f8c4b', tint: null },
  winter: { skyT: '#9fbfe0', skyB: '#f3eee6', grass: '#93ae79', meadow: '#aac58b', forest: '#557d5c', path: '#efe3cb', road: '#c9c0b0', shallow: '#93bdcb', deep: '#386b86', pool: '#8bd9db', pine: '#2a6a52', broad: '#9d9a67', cyp: '#b9622b', tint: null },
};
const pal = { ...PAL[season] };
if (time === 'dusk') { pal.skyT = season === 'winter' ? '#1e2a52' : '#2b3a78'; pal.skyB = '#f4a462'; }
const SOIL = '#8b6a49', SOILD = '#6c5238', ROCK = '#6d6a62';

/* ---------------------------------------------------------------- world model */
const island = blob(0, 0, 32, 24, 56, 0.045, 11);
const lake = blob(20, 1, 8.2, 11, 40, 0.06, 5);
const pond = blob(-18, -11.5, 5, 3.4, 28, 0.08, 9);
const meadow = blob(-11, 2.5, 11, 8, 36, 0.07, 4);
const poolPoly = (() => { const c = [3, 5.5], w = 5.2, d = 3.0, r = 1.4, o = []; for (let i = 0; i < 40; i++) { const th = i / 40 * Math.PI * 2; const cx = Math.cos(th), sz = Math.sin(th); o.push([c[0] + (Math.sign(cx) * Math.pow(Math.abs(cx), .6)) * w * (1 + .12 * Math.sin(th * 3)), c[1] + (Math.sign(sz) * Math.pow(Math.abs(sz), .6)) * d]); } return o; })();
const paths = {
  main: [[-23, 14], [-17, 11.5], [-11, 8.5], [-6, 4.5], [-3, -2]],
  pool: [[-6, 4.5], [-3.6, 7.4], [0, 9.4], [3, 10.2]],
  dock: [[3, 10.2], [8.6, 7.4], [12, 3.2]],

  const tags = `<span class="tag g">${ic('Check', 12)}${lang === 'en' ? '100% alcohol-free' : '完全不含酒精'}</span> ${allVeg ? `<span class="tag g">${ic('Leaf', 12)}${lang === 'en' ? 'Every item vegetarian' : '全部為素食'}</span>` : ''} <span class="tag o">${ic('Check', 12)}${lang === 'en' ? 'Included in fee' : '已含在費用中'}</span>`;
  const secs = mn.sections.map(sec => `<div class="msec"><div class="mh">${ic(sec.icon, 17)}${t(sec.title)}${sec.time ? `<span style="margin-left:auto;font-weight:600;color:#8a7a5a">${sec.time}</span>` : ''}</div>${sec.items.map(it => `<div class="it"><div><b>${t(it.name)}</b>${it.note ? `<small>${t(it.note)}</small>` : ''}</div><div class="ch">${(it.vegetarian && !allVeg) ? `<i class="v">${lang === 'en' ? 'Veg' : '素'}</i>` : ''}${it.caffeineFree ? `<i class="v">${lang === 'en' ? 'Caffeine-free' : '無咖啡因'}</i>` : ''}${(it.allergens || []).map(al => `<i>${({ milk: lang === 'en' ? 'Milk' : '奶', gluten: lang === 'en' ? 'Gluten' : '麩質', egg: lang === 'en' ? 'Egg' : '蛋', soy: lang === 'en' ? 'Soy' : '大豆', sesame: lang === 'en' ? 'Sesame' : '芝麻' })[al]}</i>`).join('')}</div></div>`).join('')}</div>`).join('');
  return `<div class="banner" style="background:linear-gradient(135deg,${a.accent},${a.accent2})"><div style="width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center">${ic('CupSoda', 24)}</div><div><div style="font-family:var(--display);font-size:20px;font-weight:600">${t(mn.title)}</div><div style="font-size:12.5px;opacity:.92;margin-top:2px">${t(mn.intro)}</div></div></div><div style="margin:10px 0 0;display:flex;gap:6px;flex-wrap:wrap">${tags}</div>${secs}<div class="note">${ic('Info', 16)}<span>${t(mn.footnotes[0])}</span></div>`;
}
function safetyView(a) {
  const sf = a.safety;
  return `<div style="font-size:13px;color:#56655b">${S.panel.rulesIntro}</div>${sf.rules.map((r, i) => `<div class="rule"><div class="i" style="background:${a.accent2}66;color:${a.accent}">${ic(r.icon, 18)}</div><div><b>${t(r.title)}</b><p>${t(r.body)}</p></div><span class="num">${i + 1}</span></div>`).join('')}`;
}
function panel() {
  const a = AREA[areaId]; const tabs = tabsFor(a);
  const body = tab === 'menu' ? menuView(a) : tab === 'safety' ? safetyView(a) : highlights(a);
  const cls = mobile ? 'sheet' : 'panel';
  const tabLbl = { highlights: S.panel.tabs.highlights, media: S.panel.tabs.media, menu: S.panel.tabs.menu, safety: S.panel.tabs.safety };
  const idx = chipOrder.indexOf(areaId) + 1;
  return `<div class="${cls} ${mobile ? '' : 'panel-in'}">${mobile ? '<div class="grab"></div>' : ''}
  <div class="ph" style="background:linear-gradient(135deg,${a.accent} 0%,${shade(a.accent, .72)} 100%)"><div class="row"><div class="ic">${ic(a.icon, 22)}</div><span class="kick2">${idx} / 11 · ${S.map.places}</span><div class="nav2"><i>${ic('ChevronLeft', 16)}</i><i>${ic('ChevronRight', 16)}</i></div></div>
  <span class="x">${ic('X', 16)}</span><h2>${t(a.name)}</h2><p>${t(a.tagline)}</p></div>
  <div class="tabs">${tabs.map(id => `<span class="${id === tab ? 'on' : ''}">${tabLbl[id]}</span>`).join('')}</div>
  <div class="body">${body}</div></div>`;
}

/* sky */
const sky = `<div class="sky" style="background:linear-gradient(180deg,${pal.skyT},${pal.skyB})"></div>` + (time === 'dusk' ? `<div class="sky" style="background:radial-gradient(1200px 500px at 70% 78%,rgba(255,170,90,.55),transparent 70%)"></div>${Array.from({ length: 60 }, (_, i) => { const r = rnd(i + 9); return `<i style="position:absolute;left:${r() * 100}%;top:${r() * 40}%;width:${1 + r() * 1.8}px;height:${1 + r() * 1.8}px;border-radius:50%;background:#fff;opacity:${.3 + r() * .6}"></i>`; }).join('')}` : `<div class="sky" style="background:radial-gradient(900px 420px at 78% 8%,rgba(255,244,214,.9),transparent 65%)"></div><svg style="position:absolute;left:0;top:0;width:100%;height:42%;opacity:.85" viewBox="0 0 1600 300"><g fill="#fff"><ellipse cx="260" cy="90" rx="120" ry="26"/><ellipse cx="330" cy="76" rx="70" ry="24"/><ellipse cx="1180" cy="140" rx="150" ry="30"/><ellipse cx="1260" cy="124" rx="80" ry="26"/><ellipse cx="760" cy="52" rx="90" ry="18"/></g></svg>`);

const app = document.getElementById('app');
app.innerHTML = `<div class="frame" style="width:${W}px;height:${H}px">${sky}
<div class="stage" style="transform:translate(${f1(stageX)}px,${f1(stageY)}px) scale(${c})"><div class="world" style="${worldTf}">${worldSvg}</div><div style="pointer-events:none">${labels}</div></div>
${header}${scene === 'hero' ? heroCard + metrics : ''}${mapCtl}${chips}${scene === 'area' ? panel() : ''}<div class="mock">Design mockup · live version is a rotatable 3D scene</div></div>`;
document.fonts.ready.then(() => document.body.setAttribute('data-ready', '1'));
})();
</script>
</body>
</html>
